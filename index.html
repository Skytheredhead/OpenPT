<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenPT</title>
<base href="/" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: oklch(0.16 0.005 240);
    --bg-1: oklch(0.19 0.006 240);
    --bg-2: oklch(0.23 0.007 240);
    --bg-3: oklch(0.27 0.008 240);
    --bg-hi: oklch(0.32 0.010 240);
    --line: oklch(0.32 0.010 240 / 0.7);
    --line-soft: oklch(0.32 0.010 240 / 0.3);
    --fg-0: oklch(0.96 0.003 240);
    --fg-1: oklch(0.78 0.005 240);
    --fg-2: oklch(0.60 0.006 240);
    --fg-3: oklch(0.45 0.007 240);
    --accent: oklch(0.78 0.13 220);
    --accent-dim: oklch(0.48 0.11 220);
    --accent-soft: oklch(0.78 0.13 220 / 0.14);
    --ok: oklch(0.78 0.15 150);
    --warn: oklch(0.84 0.14 90);
    --err: oklch(0.70 0.19 25);
    --magenta: oklch(0.72 0.17 330);
    --violet: oklch(0.72 0.15 290);
    --grid: oklch(0.28 0.010 240 / 0.45);
    --grid-dot: oklch(0.42 0.012 240 / 0.45);
    --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg-0); color: var(--fg-0); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
  body { font-size: 13px; letter-spacing: -0.005em; }
  button { font-family: inherit; color: inherit; }
  ::selection { background: var(--accent-soft); }

  /* ── App shell ───────────────────────────────────────────── */
  .app {
    display: grid;
    grid-template-rows: 38px 1fr;
    height: 100vh;
    width: 100vw;
  }
  .titlebar {
    display: flex; align-items: center;
    background: var(--bg-1);
    border-bottom: 1px solid var(--line);
    padding: 0 12px;
    gap: 16px;
    user-select: none;
  }
  .tb-logo {
    display: flex; align-items: center; gap: 8px;
    font-weight: 600; letter-spacing: -0.01em;
  }
  .tb-logo .glyph {
    width: 18px; height: 18px; position: relative;
    background:
      radial-gradient(circle at 50% 50%, var(--accent) 0 2.2px, transparent 2.5px),
      radial-gradient(circle at 15% 20%, var(--fg-1) 0 1.2px, transparent 1.5px),
      radial-gradient(circle at 85% 20%, var(--fg-1) 0 1.2px, transparent 1.5px),
      radial-gradient(circle at 15% 80%, var(--fg-1) 0 1.2px, transparent 1.5px),
      radial-gradient(circle at 85% 80%, var(--fg-1) 0 1.2px, transparent 1.5px);
    opacity: 0.85;
  }
  .tb-logo .glyph::before, .tb-logo .glyph::after {
    content: none;
  }
  .tb-menus { display: flex; gap: 2px; position: relative; }
  .tb-menu {
    padding: 4px 8px; border-radius: 5px;
    color: var(--fg-1); font-size: 12.5px;
    cursor: default;
    user-select: none;
  }
  .tb-menu:hover, .tb-menu.open { background: var(--bg-2); color: var(--fg-0); }
  .tb-menu.open { background: var(--bg-3); }
  .tb-dropdown {
    position: absolute; top: 100%; left: 0;
    min-width: 240px;
    background: color-mix(in oklab, var(--bg-1) 96%, transparent);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 14px 36px rgba(0,0,0,0.55);
    backdrop-filter: blur(10px);
    padding: 5px;
    z-index: 150;
    font-size: 12.5px;
  }
  .tb-dropdown-item {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px;
    border-radius: 5px;
    cursor: default;
    color: var(--fg-1);
  }
  .tb-dropdown-item:hover { background: var(--accent-soft); color: var(--fg-0); }
  .tb-dropdown-item .kbd {
    margin-left: auto;
    font-family: var(--font-mono); font-size: 10px;
    background: var(--bg-2); padding: 1px 5px; border-radius: 3px;
    color: var(--fg-3); border: 1px solid var(--line);
  }
  .tb-dropdown-sep {
    height: 1px; margin: 4px 4px;
    background: var(--line-soft);
  }
  .tb-dropdown-section {
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--fg-3); padding: 5px 10px 3px;
  }
  .tb-center {
    flex: 1; display: flex; justify-content: center; align-items: center;
  }
  .tb-status-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 10px 3px 8px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 12px; color: var(--fg-1);
    font-family: var(--font-mono);
    white-space: nowrap;
  }
  .tb-status-chip .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ok); box-shadow: 0 0 8px var(--ok);
  }
  .tb-status-chip.sim .dot { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: pulse 1.4s infinite; }
  .tb-status-chip.dirty .dot { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .tb-status-chip.saving .dot {
    width: 10px; height: 10px;
    background: transparent;
    border: 2px solid color-mix(in oklab, var(--warn) 24%, var(--line));
    border-top-color: var(--warn);
    box-shadow: none;
    animation: tbspin 0.75s linear infinite;
  }
  .tb-status-chip.err .dot, .tb-status-chip.conflict .dot { background: var(--err); box-shadow: 0 0 8px var(--err); }
  .tb-status-chip.offline .dot, .tb-status-chip.readonly .dot { background: var(--fg-3); box-shadow: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes tbspin { to { transform: rotate(360deg); } }
  .tb-actions { display: flex; gap: 6px; }
  .tb-btn {
    appearance: none; border: 1px solid var(--line); background: var(--bg-2);
    color: var(--fg-1); padding: 4px 9px; border-radius: 6px;
    font-size: 12px; cursor: default; display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .tb-btn:hover { background: var(--bg-3); color: var(--fg-0); }
  .tb-btn.primary { background: var(--accent-soft); border-color: var(--accent-dim); color: var(--accent); }
  .tb-btn.primary:hover { background: color-mix(in oklab, var(--accent) 22%, transparent); }
  .tb-btn .kbd {
    font-family: var(--font-mono); font-size: 10.5px;
    background: var(--bg-1); padding: 1px 4px; border-radius: 3px;
    color: var(--fg-2); border: 1px solid var(--line);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 260;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in oklab, var(--bg-0) 72%, transparent);
  }
  .modal {
    width: min(520px, calc(100vw - 32px));
    max-height: calc(100vh - 48px);
    overflow: hidden;
    display: grid;
    grid-template-rows: 42px 1fr;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
  }
  .modal-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px 0 16px;
    border-bottom: 1px solid var(--line);
  }
  .modal-title {
    flex: 1;
    font-weight: 600;
    min-width: 0;
  }
  .project-modal-title {
    display: flex;
    align-items: baseline;
    gap: 4px;
    min-width: 0;
  }
  .project-modal-title span {
    min-width: 0;
    color: var(--fg-2);
    font-weight: 400;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .modal-body {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: auto;
  }
  .modal-body label {
    display: grid;
    gap: 6px;
    color: var(--fg-2);
    font-size: 12px;
  }
  .hp-field {
    position: absolute;
    left: -10000px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }
  .modal-body input {
    background: var(--bg-0);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--fg-0);
    padding: 8px 10px;
    font: inherit;
  }
  .icon-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--fg-2);
    font-size: 18px;
    width: 26px;
    height: 26px;
    border-radius: 5px;
  }
  .icon-btn:hover { background: var(--bg-2); color: var(--fg-0); }
  .segmented {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--bg-0);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px;
  }
  .segmented button {
    border: 0;
    background: transparent;
    color: var(--fg-2);
    border-radius: 4px;
    padding: 7px;
  }
  .segmented button.active {
    background: var(--bg-2);
    color: var(--fg-0);
  }
  .modal-error {
    border: 1px solid color-mix(in oklab, var(--err) 45%, var(--line));
    background: color-mix(in oklab, var(--err) 12%, transparent);
    color: var(--err);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 12px;
  }
  .modal-success {
    border: 1px solid color-mix(in oklab, var(--ok) 45%, var(--line));
    background: color-mix(in oklab, var(--ok) 12%, transparent);
    color: var(--ok);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 12px;
  }
  .account-panel {
    gap: 14px;
  }
  .account-form {
    display: grid;
    gap: 12px;
  }
  .account-summary {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: space-between;
    border: 1px solid var(--line);
    background: var(--bg-2);
    border-radius: 6px;
    padding: 12px;
  }
  .account-summary div {
    display: grid;
    gap: 3px;
    min-width: 0;
  }
  .account-summary span,
  .danger-zone small,
  .session-row small {
    color: var(--fg-3);
    font-size: 11px;
  }
  .account-summary strong,
  .session-row strong {
    color: var(--fg-0);
    overflow-wrap: anywhere;
  }
  .session-list {
    display: grid;
    gap: 6px;
  }
  .session-row {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px;
    background: var(--bg-1);
  }
  .session-row.current {
    border-color: var(--accent-dim);
    background: var(--accent-soft);
  }
  .session-row div,
  .danger-zone div {
    display: grid;
    gap: 4px;
    min-width: 0;
  }
  .danger-zone {
    display: grid;
    gap: 10px;
    border: 1px solid color-mix(in oklab, var(--err) 40%, var(--line));
    background: color-mix(in oklab, var(--err) 8%, var(--bg-1));
    border-radius: 6px;
    padding: 12px;
  }
  .debug-link {
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 8px;
    font-size: 11px;
    overflow-wrap: anywhere;
  }
  .debug-link a { color: var(--accent); }
  .account-row, .modal-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .account-row span { flex: 1; color: var(--fg-1); }
  .sync-line {
    font-family: var(--font-mono);
    color: var(--fg-2);
    font-size: 11px;
  }
  .project-list {
    display: grid;
    gap: 6px;
  }
  .project-row {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--fg-1);
    border-radius: 6px;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    text-align: left;
  }
  .project-row:hover { background: var(--bg-3); color: var(--fg-0); }
  .project-row small { color: var(--fg-3); font-family: var(--font-mono); }
  .project-browser {
    min-width: min(860px, calc(100vw - 32px));
  }
  .modal:has(.project-browser) {
    width: min(900px, calc(100vw - 32px));
  }
  .project-browser-tabs {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .project-browser-tabs button {
    display: flex;
    justify-content: center;
    gap: 6px;
    align-items: center;
    min-width: 0;
    white-space: nowrap;
  }
  .project-browser-tabs span {
    color: var(--fg-3);
    font-family: var(--font-mono);
    font-size: 10px;
  }
  .project-browser-list {
    max-height: min(54vh, 520px);
    overflow: auto;
    padding-right: 2px;
  }
  .project-browser-tools {
    justify-content: flex-end;
  }
  .project-browser-row {
    position: relative;
    align-items: stretch;
    padding: 0;
    overflow: visible;
    background: var(--bg-1);
  }
  .project-browser-row:has(.project-row-menu) {
    z-index: 25;
  }
  .project-browser-row.active {
    border-color: var(--accent-dim);
    background: color-mix(in oklab, var(--accent) 9%, var(--bg-1));
  }
  .project-browser-row.conflict {
    border-color: color-mix(in oklab, var(--warn) 62%, var(--line));
  }
  .project-row-main {
    min-width: 0;
    flex: 1;
    display: grid;
    gap: 5px;
    padding: 10px 12px;
    cursor: default;
  }
  .project-row-title {
    min-width: 0;
    color: var(--fg-0);
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .project-row-title input {
    width: min(360px, 100%);
    padding: 5px 7px;
    border: 1px solid var(--accent-dim);
    border-radius: 5px;
    background: var(--bg-0);
    color: var(--fg-0);
    font: inherit;
  }
  .project-row-main small {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .project-row-actions {
    position: relative;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 5px;
    justify-content: center;
    padding: 8px 10px;
    border-left: 1px solid var(--line-soft);
    background: color-mix(in oklab, var(--bg-0) 38%, transparent);
  }
  .project-menu-button {
    width: 30px;
    justify-content: center;
    font-family: var(--font-mono);
    font-weight: 700;
  }
  .project-row-menu {
    position: absolute;
    right: 8px;
    top: calc(100% - 4px);
    z-index: 20;
    display: grid;
    min-width: 168px;
    padding: 5px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: color-mix(in oklab, var(--bg-1) 98%, transparent);
    box-shadow: 0 14px 30px rgba(0,0,0,0.46);
  }
  .project-row-menu button {
    appearance: none;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--fg-1);
    padding: 7px 9px;
    text-align: left;
    font-size: 12px;
  }
  .project-row-menu button:hover:not(:disabled) {
    background: var(--bg-2);
    color: var(--fg-0);
  }
  .project-row-menu button.danger {
    color: color-mix(in oklab, var(--err) 82%, var(--fg-0));
  }
  .project-row-menu button:disabled {
    opacity: 0.45;
  }
  .project-submenu {
    position: relative;
  }
  .project-submenu > button {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .project-submenu-menu {
    position: absolute;
    right: calc(100% + 5px);
    top: -5px;
    z-index: 21;
    display: none;
    min-width: 92px;
    padding: 5px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: color-mix(in oklab, var(--bg-1) 98%, transparent);
    box-shadow: 0 14px 30px rgba(0,0,0,0.46);
  }
  .project-submenu:hover .project-submenu-menu,
  .project-submenu:focus-within .project-submenu-menu {
    display: grid;
  }
  .project-status-badge {
    display: inline-flex;
    align-items: center;
    height: 20px;
    padding: 0 7px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--fg-2);
    font-family: var(--font-ui);
    font-size: 11px;
  }
  .project-status-badge.local { color: var(--fg-1); }
  .project-status-badge.cloud { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-soft); }
  .project-status-badge.conflict { color: var(--warn); border-color: color-mix(in oklab, var(--warn) 58%, var(--line)); background: color-mix(in oklab, var(--warn) 12%, transparent); }
  @media (max-width: 640px) {
    .modal:has(.project-browser) {
      width: calc(100vw - 18px);
    }
    .project-browser {
      min-width: 0;
    }
    .project-browser-tabs {
      grid-template-columns: 1fr 1fr;
    }
    .project-browser-row {
      flex-direction: column;
    }
    .project-row-actions {
      justify-content: flex-end;
      border-left: 0;
      border-top: 1px solid var(--line-soft);
    }
  }
  .empty-row {
    color: var(--fg-3);
    padding: 12px;
    text-align: center;
  }
  .modal-sep {
    height: 1px;
    background: var(--line);
  }

  /* ── Workspace ─────────────────────────────────────────── */
  /* ── Workspace ─────────────────────────────────────────── */
  .workspace {
    display: flex;
    min-height: 0;
  }
  .center-col {
    flex: 1;
    min-width: 0;
    display: grid;
    grid-template-rows: 32px minmax(0, 1fr) var(--bottom-panel-height, 280px);
    background: var(--bg-0);
    transition: grid-template-rows 180ms cubic-bezier(0.32, 0.72, 0.32, 1);
  }
  body.is-resizing-layout .center-col { transition: none; }
  .inspector-wrap {
    width: 260px;
    transition: width 240ms cubic-bezier(0.32, 0.72, 0.32, 1);
    overflow: hidden;
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .inspector-wrap.collapsed { width: 0; }
  .inspector {
    width: 260px; min-width: 260px;
    background: var(--bg-1);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    min-height: 0;
    flex: 1;
  }
  .activity-bar {
    background: var(--bg-1);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 0; gap: 4px;
  }
  .activity-btn {
    width: 38px; height: 38px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--fg-2); cursor: default; position: relative;
  }
  .activity-btn:hover { color: var(--fg-0); background: var(--bg-2); }
  .activity-btn.active { color: var(--accent); }
  .activity-btn.active::before {
    content: ""; position: absolute; left: -10px; top: 6px; bottom: 6px;
    width: 2px; background: var(--accent); border-radius: 2px;
  }
  .activity-spacer { flex: 1; }

  .side-panel {
    width: var(--side-panel-width, 340px);
    flex: 0 0 var(--side-panel-width, 340px);
    background: var(--bg-1);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .side-head {
    padding: 10px 12px 6px;
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--fg-3); font-weight: 600;
    display: flex; align-items: center; justify-content: space-between;
  }
  .side-tabs {
    display: flex;
    border-bottom: 1px solid var(--line);
    background: var(--bg-1);
    padding: 0 4px;
  }
  .side-tab {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 9px 10px;
    font-size: 11.5px; color: var(--fg-2);
    cursor: default;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-weight: 500;
  }
  .side-tab:hover { color: var(--fg-0); }
  .side-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .side-resizer {
    flex: 0 0 8px;
    margin-left: -4px;
    margin-right: -4px;
    cursor: ew-resize;
    z-index: 20;
    position: relative;
  }
  .side-resizer::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 3px;
    width: 2px;
    background: transparent;
  }
  .side-resizer:hover::before,
  body.is-resizing-layout .side-resizer::before {
    background: var(--fg-2);
  }
  body.is-resizing-layout {
    cursor: grabbing;
    user-select: none;
  }

  .pt-side-panel {

  .tab-bar {

  .canvas-wrap {

  .bottom-panel {

  .bp-tabs {

  /* ── Status bar ──────────────────────────────────────────── */
  .statusbar {
    background: var(--bg-1);
    border-top: 1px solid var(--line);
    display: flex; align-items: center;
    padding: 0 12px;
    font-size: 11px;
    color: var(--fg-2);
    font-family: var(--font-mono);
    gap: 14px;
  }
  .statusbar .s-item { display: flex; align-items: center; gap: 6px; }
  .statusbar .s-spacer { flex: 1; }
  .statusbar .s-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

  /* ── Scrollbars ──────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--bg-hi); background-clip: content-box; border: 2px solid transparent; }

  /* ── Toast / overlay ─────────────────────────────────────── */
  .toast {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    background: var(--bg-2); color: var(--fg-0);
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);

    display: flex; align-items: center; gap: 8px;

  .toast .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .toast.ok .dot { background: var(--ok); }
  .toast.err .dot { background: var(--err); }

  .file-drop-overlay {

  .ctxmenu {
    position: fixed;
    z-index: 200;

  /* ── Loading screen ───────────────────────────────────────── */
  #boot {
    position: fixed; inset: 0;
    background: var(--bg-0);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    z-index: 9999;
    color: var(--fg-1);
    font-family: var(--font-mono);
    font-size: 13px;
    transition: opacity 600ms cubic-bezier(0.4, 0, 0.2, 1);

  #root {
    opacity: 0;
    transition: opacity 500ms cubic-bezier(0.4, 0, 0.2, 1) 100ms;
  }
  #root.ready { opacity: 1; }
  html.home-start #boot { display: none; }
  html.account-verify-start #boot { display: none; }

  html.account-verify-start #root {

<body>
<div id="boot">
  <div class="boot-logo"></div>
  <div class="boot-text">OpenPT loading<span class="dots"></span></div>
  <div class="boot-bar"><div class="boot-fill" id="boot-fill"></div></div>

<div id="root"></div>

<script>
  // Track real load progress by polling for each script's window-export
  (function () {
    if (document.documentElement.classList.contains('home-start')) return;
    var modules = ['React', 'ReactDOM', 'Babel', 'useTweaks', 'Icon', 'Glyph', 'DeviceCatalog', 'OPT_Engine', 'OpenPTFormat', 'Palette', 'Topology', 'CLI', 'Inspector', 'PacketTracerImporter'];
    var fill = document.getElementById('boot-fill');
    function tick() {
      var done = 0;
      for (var i = 0; i < modules.length; i++) {
        if (typeof window[modules[i]] !== 'undefined') done++;
      }
      // Reserve last 10% for first React render
      var pct = (done / modules.length) * 90;
      if (fill) fill.style.width = pct.toFixed(1) + '%';
      if (document.getElementById('root') && document.getElementById('root').childNodes.length > 0) {
        // App rendered
        if (fill) fill.style.width = '100%';
        return;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
  window.OpenPTDeferAppBoot = document.documentElement.classList.contains('home-start');
  window.OpenPTModuleLoader = (function () {
    var simPromise = null;
    var jsxPlugins = ['transform-react-jsx', 'transform-block-scoping'];
    var simModules = [
      { src: 'tweaks-panel.jsx', jsx: true },
      { src: 'engine.jsx', jsx: true },
      { src: 'openpt-labs.js' },
      { src: 'openpt-format.js' },
      { src: 'sim-services.jsx', jsx: true },
      { src: 'protocol-runtime.jsx', jsx: true },
      { src: 'palette.jsx', jsx: true },
      { src: 'topology.jsx', jsx: true },
      { src: 'cli.jsx', jsx: true },
      { src: 'inspector.jsx', jsx: true },
      { before: function () {
          window.OpenPTTwofishExports = {};
          window.exports = window.OpenPTTwofishExports;
        }
      },
      { src: 'vendor/twofish-ts.js' },
      { after: function () {
          window.OpenPTTwofish = window.OpenPTTwofishExports;
          delete window.OpenPTTwofishExports;
          delete window.exports;
        }
      },
      { src: 'packet-tracer-importer.js' },
      { src: 'sync-client.js' },
      { src: 'quiz/questions-data.js' },
      { src: 'jeopardy.jsx', jsx: true },
      { src: 'wordle.jsx', jsx: true },
      { src: 'subnet-games.jsx', jsx: true },
      { src: 'app.jsx', jsx: true },
    ];

    function setBootProgress(done, total) {
      var percent = Math.min(100, Math.round((done / total) * 100));
      window.OpenPTLoadProgress = percent;
      var fill = document.getElementById('boot-fill');
      if (fill) fill.style.width = percent + '%';
      var homeFill = document.getElementById('home-load-fill');
      var homePercent = document.getElementById('home-load-percent');
      if (homeFill) homeFill.style.width = percent + '%';
      if (homePercent) homePercent.textContent = percent + '%';
      window.dispatchEvent(new CustomEvent('openpt:sim-progress', { detail: { percent: percent } }));
    }

    function loadClassicScript(src) {
      return new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = function () { reject(new Error('Failed to load ' + src)); };
        document.body.appendChild(script);
      });
    }

    async function loadJsxScript(src) {
      var response = await fetch(src);
      if (!response.ok) throw new Error('Failed to load ' + src);
      var source = await response.text();
      var compiled = Babel.transform(source, {
        plugins: jsxPlugins,
        sourceMaps: 'inline',
        filename: src,
      }).code;
      (0, eval)(compiled + '\n//# sourceURL=' + location.origin + '/' + src);
    }

    async function runModule(mod) {
      if (mod.before) mod.before();
      if (mod.src) {
        if (mod.jsx) await loadJsxScript(mod.src);
        else await loadClassicScript(mod.src);
      }
      if (mod.after) mod.after();
    }

    async function loadSimulator() {
      if (!simPromise) {
        simPromise = (async function () {
          for (var i = 0; i < simModules.length; i++) {
            await runModule(simModules[i]);
            setBootProgress(i + 1, simModules.length);
          }
        })();
      }
      return simPromise;
    }

    return { loadSimulator: loadSimulator, loadClassicScript: loadClassicScript, loadJsxScript: loadJsxScript };
  })();
</script>
<script>
  (async function () {
    var isHomeStart = document.documentElement.classList.contains('home-start');
    var rootEl = document.getElementById('root');
    try {
      await window.OpenPTModuleLoader.loadJsxScript('icons.jsx');
      await window.OpenPTModuleLoader.loadJsxScript('device-glyphs.jsx');
    } catch (err) {
      console.error(err);
      rootEl.innerHTML = '<div style="padding:24px;font-family:system-ui;color:#fca5a5">Could not load the OpenPT home screen. Refresh and try again.</div>';
      return;
    }

    window.OpenPTRoot = window.OpenPTRoot || ReactDOM.createRoot(rootEl);

    function renderStaticHomeShell() {
      rootEl.classList.add('ready');
      rootEl.innerHTML = '<div class="app home-shell-preview">' +
        '<div class="titlebar">' +
          '<div class="tb-logo"><div class="glyph"></div>OpenPT<span class="home-preview-version">0.2.4-sync.20260518</span></div>' +
          '<div class="tb-menus">' +
            '<div class="tb-menu">File</div><div class="tb-menu">Edit</div><div class="tb-menu">View</div><div class="tb-menu">Lab</div><div class="tb-menu">Devices</div><div class="tb-menu">Simulation</div><div class="tb-menu">Help</div>' +
          '</div>' +
          '<div class="tb-center"></div>' +
          '<div class="tb-actions"><button class="tb-btn">Projects</button><button class="tb-btn">Login / Sign up</button></div>' +
        '</div>' +
        '<div class="workspace"><div class="center-col">' +
          '<div class="tab-bar"><div class="tab active home-tab"><span class="dot"></span><span>home.html</span></div><div class="tab-spacer"></div></div>' +
          '<div class="home-tab-surface"><iframe class="home-tab-frame" src="/home.html" title="OpenPT home"></iframe></div>' +
          '<div class="bottom-panel"><div class="bp-tabs"><div class="bp-tab active">Events <span class="badge">2</span></div><div class="bp-tab">Packets</div><div class="bp-tab">Validation</div><div class="bp-spacer"></div></div>' +
            '<div class="events"><div class="event"><span>54:37</span><span class="ok">system</span><span>created new empty project</span></div><div class="event"><span>54:37</span><span class="ok">system</span><span>OpenPT initialized - loading simulator</span></div></div>' +
          '</div>' +
        '</div></div>' +
        '<div class="home-load-card" role="status" aria-live="polite"><div class="home-load-row"><span>Loading simulator</span><strong id="home-load-percent">0%</strong></div><div class="home-load-track"><div id="home-load-fill" style="width:0%"></div></div></div>' +
      '</div>';
    }

    function renderFullApp(intent) {
      if (!window.OpenPTApp) return;
      window.OpenPTRoot.render(React.createElement(window.OpenPTApp, {
        initialViewMode: 'app',
        initialHomeAction: intent && intent !== 'home' ? intent : null
      }));
    }

    function renderAccountVerify(state) {
      var copy = state === 'pending'
        ? 'Checking your verification link.'
        : state === 'error'
          ? 'This verification link is invalid or expired.'
          : 'Your OpenPT account is ready.';
      var title = state === 'pending'
        ? 'Verifying email...'
        : state === 'error'
          ? 'Verification failed'
          : 'Email verified!';
      var mark = state === 'error' ? '!' : state === 'pending' ? '...' : '✓';
      var action = state === 'pending'
        ? ''
        : '<a class="account-verify-action" href="/">Sign in</a>';
      rootEl.classList.add('ready');
      rootEl.innerHTML = '<main class="account-verify-page"><section class="account-verify-panel">' +
        '<div class="account-verify-mark">' + mark + '</div>' +
        '<h1 class="account-verify-title">' + title + '</h1>' +
        '<p class="account-verify-copy">' + copy + '</p>' +
        action +
        '</section></main>';
    }

    async function verifyAccountEmail() {
      var params = new URLSearchParams(location.search);
      var token = params.get('verifyEmail') || '';
      if (!token) return;
      renderAccountVerify('pending');
      try {
        await window.OpenPTModuleLoader.loadClassicScript('sync-client.js');
        var client = new window.OpenPTSync.OpenPTSyncClient();
        await client.verifyEmail(token);
        params.delete('verifyEmail');
        var nextQuery = params.toString();
        history.replaceState(null, '', location.pathname + (nextQuery ? '?' + nextQuery : '') + (location.hash || ''));
        renderAccountVerify('success');
      } catch (err) {
        console.error(err);
        renderAccountVerify('error');
      }
    }

    async function enterLab(intent) {
      try {
        await window.OpenPTModuleLoader.loadSimulator();
        if (intent && intent !== 'home' && location.pathname === '/') {
          history.replaceState(null, '', '/lab' + (location.search || '') + (location.hash || ''));
        }
        renderFullApp(intent);
      } catch (err) {
        console.error(err);
        rootEl.innerHTML = '<div style="padding:24px;font-family:system-ui;color:#fca5a5">Could not load the OpenPT simulator. Refresh and try again.</div>';
      }
    }

    if (document.documentElement.classList.contains('account-verify-start')) {
      verifyAccountEmail();
      return;
    }

    if (isHomeStart) {
      renderStaticHomeShell();
      window.addEventListener('message', function (event) {
        if (event.origin !== location.origin || !event.data || event.data.type !== 'openpt:home-action') return;
        if (event.data.action === 'quiz') window.location.href = '/quiz/?view=library';
        else if (event.data.action === 'jeopardy') window.location.href = '/jeopardy';
        else enterLab(event.data.action === 'import' ? 'import' : 'lab');
      });
      var preloadSimulator = function () {
        window.OpenPTModuleLoader.loadSimulator().then(function () {
          renderFullApp('home');
        }).catch(function (err) {
          console.error(err);
        });
      };
      window.setTimeout(preloadSimulator, 0);
      return;
    }

    window.OpenPTDeferAppBoot = false;
    window.OpenPTModuleLoader.loadSimulator();
  })();
</script>
